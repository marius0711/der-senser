[project]
name = "senser"
version = "0.1.0"
description = "Der Senser: spaced-repetition flashcards in Markdown for process engineering"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fsrs>=6,<7",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
senser = "senser.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
